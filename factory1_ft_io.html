<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1공장 FT 재고 종합</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="css/common_header.css">
    <link rel="stylesheet" href="css/factory1_ft_io_style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>

    <script src="js/common_ui.js" defer></script>
</head>
<body data-notice-scope="factory1">

<div class="gf3-wrapper" data-page-module="Factory1FtIoModule">
    <div class="gf3-header">
        <div class="gf3-title-wrap">
            <span class="material-symbols-outlined gf3-hamburger">menu</span>
            <span class="gf3-main-title">1공장 FT 재고 종합</span>

            <div class="gf3-dropdown">
                <div class="gf3-dropdown-item">
                    <span class="gf3-dropdown-label">
                        1공장 FT
                        <span class="material-symbols-outlined gf3-submenu-arrow">chevron_right</span>
                    </span>
                    <div class="gf3-submenu">
                        <a href="factory1_ft.html">FT 일지</a>
                        <a href="factory1_ft_io.html" class="active">FT 재고 종합</a>
                    </div>
                </div>
                <a href="factory1_ilji.html">1공장 급지 일지</a>
                <a href="https://eellooyy.github.io/factory3/" target="_blank">3공장으로 이동</a>
            </div>
        </div>

        <div class="f3i-notice-ticker" id="f3iNoticeTicker" title="클릭하시면 전체 공지를 확인하실 수 있습니다.">
            <div class="f3i-ticker-wrapper" id="f3iTickerWrapper"></div>
        </div>

        <div class="gf3-controls">
            <div class="gf3-nav-group">
                <button id="f1FtIoPrevBtn" class="gf3-icon-btn" title="이전 날짜"><span class="material-symbols-outlined">chevron_left</span></button>
                <div class="gf3-cal-wrap" id="f1FtIoCalendarWrap">
                    <span id="f1FtIoDateText" class="gf3-date-text cursor-pointer"></span>
                    <input type="text" id="f1FtIoFlatpickr" style="display: none;">
                </div>
                <button id="f1FtIoNextBtn" class="gf3-icon-btn" title="다음 날짜"><span class="material-symbols-outlined">chevron_right</span></button>
            </div>

            <button id="f1FtIoTodayBtn" class="gf3-action-btn today-btn">오늘</button>
            <button id="f1FtIoEditBtn" class="gf3-action-btn edit-btn" disabled>수정</button>
            <button id="f1FtIoSaveBtn" class="gf3-action-btn save-btn" disabled>저장</button>
            <button id="f1FtIoExcelBtn" class="gf3-action-btn excel-btn">
                <span class="material-symbols-outlined" style="font-size: 16px; margin-right: 4px;">table_view</span>엑셀 출력
            </button>
        </div>
    </div>
</div>

<div class="gf3-wrapper f1ftio-wrapper" data-page-module="Factory1FtIoModule">
    <!-- 1층: FT 실재고 및 ERP 대조 (4단 비교표) -->
    <div class="f1ftio-panel f1ftio-main-panel mb-4">
        <!-- 대조표 카드 상단 헤더 & 스크롤 ON/OFF 스위치 -->
        <div class="panel-header-grid mb-3" style="padding: 0 4px;">
            <div class="header-left"></div>
            <div class="header-center text-center">
                <span class="panel-title">FT 실재고 및 ERP 대조</span>
            </div>
            <div class="header-right d-flex align-items-center justify-content-end gap-2">
                <span class="small fw-bold text-dark me-1">과거 스크롤</span>
                <label class="f1-toggle-switch" title="과거 DB 스크롤 ON/OFF">
                    <input type="checkbox" id="compScrollToggle">
                    <span class="f1-toggle-slider"></span>
                </label>
            </div>
        </div>

        <div class="comp-panels-outer">
            <!-- 패널 1: 출고 -->
            <div class="comp-panel">
                <div class="comp-scroll-area locked" id="compScrollPanel1">
                    <div id="compCursor1" class="comp-cursor"></div>
                    <table class="comp-table-split">
                        <thead>
                            <tr class="comp-thead-lv1">
                                <th class="comp-date-th" rowspan="2">날짜</th>
                                <th colspan="3" class="comp-group-th">출고</th>
                            </tr>
                            <tr class="comp-thead-lv2">
                                <th class="comp-leaf-th" data-col="1">A</th>
                                <th class="comp-leaf-th" data-col="2">C</th>
                                <th class="comp-leaf-th" data-col="3">D</th>
                            </tr>
                        </thead>
                        <tbody id="compBody1"></tbody>
                    </table>
                </div>
            </div>

            <!-- 패널 2: ERP 재고 -->
            <div class="comp-panel">
                <div class="comp-scroll-area locked" id="compScrollPanel2">
                    <div id="compCursor2" class="comp-cursor"></div>
                    <table class="comp-table-split comp-no-date">
                        <thead>
                            <tr class="comp-thead-lv1">
                                <th colspan="3" class="comp-group-th">ERP 재고</th>
                            </tr>
                            <tr class="comp-thead-lv2">
                                <th class="comp-leaf-th" data-col="1">A</th>
                                <th class="comp-leaf-th" data-col="2">C</th>
                                <th class="comp-leaf-th" data-col="3">D</th>
                            </tr>
                        </thead>
                        <tbody id="compBody2"></tbody>
                    </table>
                </div>
            </div>

            <!-- 패널 3: 실재고 -->
            <div class="comp-panel">
                <div class="comp-scroll-area locked" id="compScrollPanel3">
                    <div id="compCursor3" class="comp-cursor"></div>
                    <table class="comp-table-split comp-no-date">
                        <thead>
                            <tr class="comp-thead-lv1">
                                <th colspan="3" class="comp-group-th">실재고</th>
                            </tr>
                            <tr class="comp-thead-lv2">
                                <th class="comp-leaf-th" data-col="1">A</th>
                                <th class="comp-leaf-th" data-col="2">C</th>
                                <th class="comp-leaf-th" data-col="3">D</th>
                            </tr>
                        </thead>
                        <tbody id="compBody3"></tbody>
                    </table>
                </div>
            </div>

            <!-- 패널 4: 실재고 - ERP -->
            <div class="comp-panel">
                <div class="comp-scroll-area locked" id="compScrollPanel4">
                    <div id="compCursor4" class="comp-cursor"></div>
                    <table class="comp-table-split comp-no-date">
                        <thead>
                            <tr class="comp-thead-lv1">
                                <th colspan="3" class="comp-group-th">실재고-ERP</th>
                            </tr>
                            <tr class="comp-thead-lv2">
                                <th class="comp-leaf-th" data-col="1">A</th>
                                <th class="comp-leaf-th" data-col="2">C</th>
                                <th class="comp-leaf-th" data-col="3">D</th>
                            </tr>
                        </thead>
                        <tbody id="compBody4"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 2층: 하단 서브 카드 좌우 배치 (좌: 입고 현황 / 우: 월별 출고 현황) -->
    <div class="f1ftio-bottom-grid">
        <!-- 2-1: 입고 현황 카드 -->
        <div class="f1ftio-panel side-card">
            <div class="panel-header-grid mb-3">
                <div class="header-left d-flex align-items-center">
                    <div class="unit-switcher shadow-sm" id="unitToggle">
                        <div class="selection-bg mode-roll" id="switcherBg"></div>
                        <button class="unit-btn active" id="btnRoll" data-unit="RL" type="button"> R/L </button>
                        <button class="unit-btn" id="btnKg" data-unit="KG" type="button"> Kg </button>
                    </div>
                </div>
                <div class="header-center text-center">
                    <span class="panel-title">입고 현황</span>
                </div>
                <div class="header-right d-flex align-items-center justify-content-end gap-1">
                    <button class="btn-nav-mini" id="in-prev" type="button"><span class="material-symbols-outlined">chevron_left</span></button>
                    <span class="f1ftio-year-text" id="in-year-txt"></span>
                    <button class="btn-nav-mini" id="in-next" type="button"><span class="material-symbols-outlined">chevron_right</span></button>
                </div>
            </div>

            <!-- 레이아웃 안의 레이아웃 프레임 -->
            <div class="inner-layout-card">
                <div class="table-scroll-wrapper" style="max-height: 180px; min-height: 180px; overflow-y: auto;">
                    <table class="custom-compact-table text-center m-0">
                        <thead>
                            <tr>
                                <th style="width: 34%; text-align: center;">일자</th>
                                <th style="width: 22%; text-align: center;">A</th>
                                <th style="width: 22%; text-align: center;">C</th>
                                <th style="width: 22%; text-align: center;">D</th>
                            </tr>
                        </thead>
                        <tbody id="in-body">
                            <tr><td colspan="4" class="py-4 text-center text-muted small">불러오는 중...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 2-2: 월별 출고 현황 카드 -->
        <div class="f1ftio-panel side-card">
            <div class="panel-header-grid mb-3">
                <div class="header-left"></div>
                <div class="header-center text-center">
                    <span class="panel-title">월별 출고 현황</span>
                </div>
                <div class="header-right d-flex align-items-center justify-content-end gap-1">
                    <button class="btn-nav-mini" id="out-prev" type="button"><span class="material-symbols-outlined">chevron_left</span></button>
                    <span class="f1ftio-year-text" id="out-date-txt"></span>
                    <button class="btn-nav-mini" id="out-next" type="button"><span class="material-symbols-outlined">chevron_right</span></button>
                </div>
            </div>

            <!-- 레이아웃 안의 레이아웃 프레임 -->
            <div class="inner-layout-card">
                <div class="table-scroll-wrapper" style="max-height: 180px; min-height: 180px; overflow-y: auto;">
                    <table class="custom-compact-table text-center m-0">
                        <thead>
                            <tr>
                                <th style="width: 34%; text-align: center;">월</th>
                                <th style="width: 22%; text-align: center;">A</th>
                                <th style="width: 22%; text-align: center;">C</th>
                                <th style="width: 22%; text-align: center;">D</th>
                            </tr>
                        </thead>
                        <tbody id="out-body">
                            <tr><td colspan="4" class="py-4 text-center text-muted small">불러오는 중...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="f3iNoticeModal" class="f3i-nmodal-overlay">
    <div class="f3i-nmodal-box">
        <div class="f3i-nmodal-header">
            <button id="f3iNoticeBackBtn" class="f3i-nmodal-back-btn" style="display: none;">
                <span class="material-symbols-outlined">arrow_back</span> 뒤로가기
            </button>
            <span id="f3iNoticeModalTitle" class="f3i-nmodal-title">전체 공지사항 목록</span>
            <span id="f3iNoticeCloseBtn" class="material-symbols-outlined f3i-nmodal-close">close</span>
        </div>
        <div class="f3i-nmodal-body" id="f3iNoticeModalBody"></div>
        <div class="f3i-nmodal-footer-info" id="f3iMasterNoticeInfo" style="display: none;">
            ⚠️ 마스터 모드: 글이나 HTML 태그를 편집한 후 상단 [저장] 버튼을 누르면 확정됩니다.
        </div>
    </div>
</div>

<script src="js/common_utils.js"></script>
<script src="js/common_header.js"></script>
<script src="js/factory1_ft_io_constant.js"></script>
<script src="js/factory1_ft_io_api.js"></script>
<script src="js/factory1_ft_io_render.js"></script>
<script src="js/factory1_ft_io_main.js"></script>
</body>
</html>
