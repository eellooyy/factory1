<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="css/common_header.css">
    <link rel="stylesheet" href="css/factory1_ipgo_style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

    <script src="js/common_ui.js" defer></script>
</head>
<body data-notice-scope="factory1">

<div class="gf3-wrapper" data-page-module="Factory1IpgoModule" style="padding-bottom: 0;">
    <div class="gf3-header">
        <div class="gf3-title-wrap">
            <span class="material-symbols-outlined gf3-hamburger">menu</span>
            <span class="gf3-main-title">1공장 입고</span>

            <div class="gf3-dropdown">
                <a href="factory1_ipgo.html" class="active">1공장 입고</a>
                <div class="gf3-dropdown-item">
                    <span class="gf3-dropdown-label">
                        1공장 FT
                        <span class="material-symbols-outlined gf3-submenu-arrow">chevron_right</span>
                    </span>
                    <div class="gf3-submenu">
                        <a href="factory1_ft.html">FT 일지</a>
                        <a href="factory1_ft_io.html">FT 재고 종합</a>
                    </div>
                </div>
                <a href="factory1_ilji.html">1공장 급지 일지</a>
                <a href="https://eellooyy.github.io/factory3/" target="_blank">3공장으로 이동</a>
            </div>
        </div>

        <div class="f3i-notice-ticker" id="f3iNoticeTicker" title="클릭하시면 전체 공지를 확인하실 수 있습니다.">
            <div class="f3i-ticker-wrapper" id="f3iTickerWrapper"></div>
        </div>

        <div class="gf3-controls">
            <div class="gf3-nav-group">
                <button id="f1IpgoPrevBtn" class="gf3-icon-btn" title="이전 날짜"><span class="material-symbols-outlined">chevron_left</span></button>
                <div class="gf3-cal-wrap" id="f1IpgoCalendarWrap">
                    <span id="f1IpgoDateText" class="gf3-date-text cursor-pointer"></span>
                    <input type="text" id="f1IpgoFlatpickr" style="display: none;">
                </div>
                <button id="f1IpgoNextBtn" class="gf3-icon-btn" title="다음 날짜"><span class="material-symbols-outlined">chevron_right</span></button>
            </div>

            <button id="f1IpgoTodayBtn" class="gf3-action-btn today-btn">오늘</button>
            <button id="f1IpgoEditBtn" class="gf3-action-btn edit-btn" disabled>수정</button>
            <button id="f1IpgoSaveBtn" class="gf3-action-btn save-btn" disabled>저장</button>
            <button id="f1IpgoExcelBtn" class="gf3-action-btn f3i-pdf-btn">
                <span class="material-symbols-outlined" style="font-size: 16px; margin-right: 4px;">picture_as_pdf</span>PDF 저장
            </button>
        </div>
    </div>
</div>

<div class="gf3-wrapper f1ip-wrapper" data-page-module="Factory1IpgoModule" style="padding-top: 16px;">

    <!-- 1층: 좌측 7 (입고 및 별쇄 계획표) : 우측 3 (추가 영역) -->
    <div class="f1ip-top-grid">

    <div class="f1ip-floor-container f1ip-main-card">
        <div class="panel-header-grid mb-3">
            <div class="header-left">
                <span class="panel-title">입고 및 별쇄 계획표</span>
            </div>
            <div class="header-center text-center"></div>
            <div class="header-right d-flex align-items-center justify-content-end gap-2">
                <span class="panel-toggle-label">스크롤 ON/OFF</span>
                <label class="f1-toggle-switch" title="과거 DB 스크롤 ON/OFF">
                    <input type="checkbox" id="ipgoScrollToggle">
                    <span class="f1-toggle-slider"></span>
                </label>
            </div>
        </div>

        <div class="f1ip-panels-outer">
            <!-- 좌측: 입고 대장 -->
            <div class="f1ip-panel f1ip-panel-ledger">
                <div class="f1ip-scroll-area locked" id="f1ipScrollPanel">
                    <div id="f1ipCursor" class="f1ip-cursor"></div>
                    <table class="f1ip-table">
                        <!-- 날짜 열은 고정폭, 나머지 12개 품목 열은 균등 분할 -->
                        <colgroup>
                            <col class="f1ip-col-date">
                            <col class="f1ip-col-data" span="12">
                        </colgroup>
                        <thead>
                            <tr class="f1ip-thead-lv1">
                                <th class="f1ip-date-th" rowspan="2">날짜</th>
                                <th colspan="2" class="f1ip-group-th" data-group="daehan-ad">대한제지</th>
                                <th rowspan="2" class="f1ip-group-th f1ip-sep f1ip-single-th" data-group="paperkorea">페이퍼<br>코리아</th>
                                <th colspan="2" class="f1ip-group-th f1ip-sep" data-group="jeonju-bonji">전주본지</th>
                                <th colspan="2" class="f1ip-group-th f1ip-sep" data-group="jeonju-jeonja">전주전자</th>
                                <th colspan="2" class="f1ip-group-th f1ip-sep" data-group="daehan-c">대한제지</th>
                                <th colspan="3" class="f1ip-group-th f1ip-sep" data-group="ft">F.T</th>
                            </tr>
                            <tr class="f1ip-thead-lv2">
                                <th class="f1ip-leaf-th" data-col="1" data-parent-group="daehan-ad">A</th>
                                <th class="f1ip-leaf-th" data-col="2" data-parent-group="daehan-ad">D</th>
                                <!-- 페이퍼 코리아는 하위 구분이 없어 1레벨 헤더가 두 행을 병합합니다 -->
                                <th class="f1ip-leaf-th f1ip-sep" data-col="4" data-parent-group="jeonju-bonji">A</th>
                                <th class="f1ip-leaf-th" data-col="5" data-parent-group="jeonju-bonji">D</th>
                                <th class="f1ip-leaf-th f1ip-sep" data-col="6" data-parent-group="jeonju-jeonja">A</th>
                                <th class="f1ip-leaf-th" data-col="7" data-parent-group="jeonju-jeonja">D</th>
                                <th class="f1ip-leaf-th f1ip-sep" data-col="8" data-parent-group="daehan-c">C</th>
                                <th class="f1ip-leaf-th" data-col="9" data-parent-group="daehan-c">48.8g</th>
                                <th class="f1ip-leaf-th f1ip-sep" data-col="10" data-parent-group="ft">A</th>
                                <th class="f1ip-leaf-th" data-col="11" data-parent-group="ft">C</th>
                                <th class="f1ip-leaf-th" data-col="12" data-parent-group="ft">D</th>
                            </tr>
                        </thead>
                        <tbody id="f1ipBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- 우측: 별쇄 계획표 (좌측 입고 대장과 스크롤이 동기화됩니다) -->
            <div class="f1ip-panel f1ip-panel-plan">
                <div class="f1ip-scroll-area locked" id="f1ipPlanScrollPanel">
                    <div id="f1ipPlanCursor" class="f1ip-cursor"></div>
                    <table class="f1ip-table f1ip-plan-table">
                        <thead>
                            <tr class="f1ip-thead-lv1">
                                <!-- 날짜 열은 데스크톱에서는 숨기고, 패널이 세로로 쌓이는 좁은 화면에서만 표시 -->
                                <th class="f1ip-date-th f1ip-responsive-date" rowspan="2">날짜</th>
                                <th colspan="3" class="f1ip-group-th" data-group="byeolswae">별쇄 계획표</th>
                            </tr>
                            <tr class="f1ip-thead-lv2">
                                <th class="f1ip-leaf-th" data-col="1" data-parent-group="byeolswae">계획</th>
                                <th class="f1ip-leaf-th" data-col="2" data-parent-group="byeolswae">수정1</th>
                                <th class="f1ip-leaf-th" data-col="3" data-parent-group="byeolswae">수정2</th>
                            </tr>
                        </thead>
                        <tbody id="f1ipPlanBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 우측 3 영역: 지종별 재고 (제목 없음 / 롤·kg 값은 DB 연동 후 반영) -->
    <div class="f1ip-floor-container f1ip-side-card" id="f1ipSideCard">
        <div class="f1ip-side-list" id="f1ipSideBody"></div>
    </div>

    </div><!-- /f1ip-top-grid -->
</div>

<div id="f3iNoticeModal" class="f3i-nmodal-overlay">
    <div class="f3i-nmodal-box">
        <div class="f3i-nmodal-header">
            <button id="f3iNoticeBackBtn" class="f3i-nmodal-back-btn" style="display: none;">
                <span class="material-symbols-outlined">arrow_back</span> 뒤로가기
            </button>
            <span id="f3iNoticeModalTitle" class="f3i-nmodal-title">전체 공지사항 목록</span>
            <span id="f3iNoticeCloseBtn" class="material-symbols-outlined f3i-nmodal-close">close</span>
        </div>
        <div class="f3i-nmodal-body" id="f3iNoticeModalBody"></div>
        <div class="f3i-nmodal-footer-info" id="f3iMasterNoticeInfo" style="display: none;">
            ⚠️ 마스터 모드: 글이나 HTML 태그를 편집한 후 상단 [저장] 버튼을 누르면 확정됩니다.
        </div>
    </div>
</div>

<script src="js/common_utils.js"></script>

<script src="js/common_pdf.js"></script>
<script src="js/factory1_ipgo_constant.js"></script>
<script src="js/factory1_ipgo_api.js"></script>
<script src="js/factory1_ipgo_render.js"></script>
<script src="js/factory1_ipgo_main.js"></script>
</body>
</html>
