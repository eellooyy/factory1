<div class="gf3-wrapper f1us-wrapper" data-page-module="Factory1UsageModule" style="padding-top: 16px;">

    <!-- ============================================================
         1층: 용지별 사용량
         열 구성은 입고 페이지 좌측 '입고 대장'과 동일합니다.
         같은 날짜 줄에서 입고 ↔ 사용을 나란히 비교하기 위해서입니다.
         (별쇄 계획표가 빠진 만큼 표가 화면 전체 폭을 씁니다)
         ============================================================ -->
    <div class="f1us-floor-container">
        <div class="panel-header-grid mb-3">
            <div class="header-left">
                <span class="panel-title">용지별 사용량</span>
                <span class="panel-subtitle">ERP 급지 실적 · 회계 보정 반영</span>
            </div>
            <div class="header-center text-center"></div>
            <div class="header-right d-flex align-items-center justify-content-end gap-2">
                <span class="panel-toggle-label">스크롤 ON/OFF</span>
                <label class="f1-toggle-switch" title="과거 DB 스크롤 ON/OFF">
                    <input type="checkbox" id="f1usPaperScrollToggle">
                    <span class="f1-toggle-slider"></span>
                </label>
            </div>
        </div>

        <div class="f1us-panels-outer">
            <div class="f1us-panel">
                <div class="f1us-scroll-area locked" id="f1usPaperScroll">
                    <div id="f1usPaperCursor" class="f1us-cursor"></div>
                    <table class="f1us-table">
                        <!-- 날짜 열은 고정폭, 나머지 14개 품목 열은 균등 분할 -->
                        <colgroup>
                            <col class="f1us-col-date">
                            <col class="f1us-col-data" span="14">
                        </colgroup>
                        <thead>
                            <tr class="f1us-thead-lv1">
                                <th class="f1us-date-th" rowspan="2">날짜</th>
                                <th colspan="2" class="f1us-group-th" data-group="daehan-ad">대한제지</th>
                                <th rowspan="2" class="f1us-group-th f1us-sep f1us-single-th" data-group="paperkorea">페이퍼<br>코리아</th>
                                <th colspan="2" class="f1us-group-th f1us-sep" data-group="jeonju-bonji">전주본지</th>
                                <th colspan="2" class="f1us-group-th f1us-sep" data-group="jeonju-jeonja">전주전자</th>
                                <th colspan="2" class="f1us-group-th f1us-sep" data-group="daehan-c">대한제지</th>
                                <th colspan="3" class="f1us-group-th f1us-sep" data-group="ft">F.T</th>
                                <!-- 별관(3공장) 참조 열 — 3공장 사용 실적을 그대로 보여줍니다 -->
                                <th colspan="2" class="f1us-group-th f1us-sep" data-group="daehan-annex">대한제지 별관</th>
                            </tr>
                            <tr class="f1us-thead-lv2">
                                <th class="f1us-leaf-th" data-col="1" data-parent-group="daehan-ad">A</th>
                                <th class="f1us-leaf-th" data-col="2" data-parent-group="daehan-ad">D</th>
                                <!-- 페이퍼 코리아는 하위 구분이 없어 1레벨 헤더가 두 행을 병합합니다 -->
                                <th class="f1us-leaf-th f1us-sep" data-col="4" data-parent-group="jeonju-bonji">A</th>
                                <th class="f1us-leaf-th" data-col="5" data-parent-group="jeonju-bonji">D</th>
                                <th class="f1us-leaf-th f1us-sep" data-col="6" data-parent-group="jeonju-jeonja">A</th>
                                <th class="f1us-leaf-th" data-col="7" data-parent-group="jeonju-jeonja">D</th>
                                <th class="f1us-leaf-th f1us-sep" data-col="8" data-parent-group="daehan-c">C</th>
                                <th class="f1us-leaf-th" data-col="9" data-parent-group="daehan-c">48.8g</th>
                                <th class="f1us-leaf-th f1us-sep" data-col="10" data-parent-group="ft">A</th>
                                <th class="f1us-leaf-th" data-col="11" data-parent-group="ft">C</th>
                                <th class="f1us-leaf-th" data-col="12" data-parent-group="ft">D</th>
                                <th class="f1us-leaf-th f1us-sep" data-col="13" data-parent-group="daehan-annex">A</th>
                                <th class="f1us-leaf-th" data-col="14" data-parent-group="daehan-annex">D</th>
                            </tr>
                        </thead>
                        <tbody id="f1usPaperBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
         2층: 매체별 사용량 — 추후 추가
         1레벨 헤더 1공장 / 3공장, 2레벨은 매체명입니다.
         3공장 매체 데이터(factory3_usage 의 media_code) 정리가 끝난 뒤
         이 자리에 f1us-floor-container 를 하나 더 넣고,
         factory1_mediause_*.js 4개를 아래 script 목록에 추가하면 됩니다.
         ============================================================ -->

</div>

        </div>
    </div>
</div>

<script src="js/factory1_paperuse_main.js"></script>
</body>
</html>
