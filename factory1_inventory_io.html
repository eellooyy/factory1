<div class="gf3-wrapper f1inv-wrapper" data-page-module="Factory1InventoryIoModule" style="padding-top: 16px;">

    <!-- 1층: 저장위치별 재고 종합표 (ERP 재고 · 전일 입출 · 실재고 대조) -->
    <div class="f1inv-floor-container">
        <div class="panel-header-grid mb-3">
            <div class="header-left">
                <span class="panel-title">재고 종합</span>
                <span class="panel-subtitle" id="f1invSubtitle"></span>
            </div>
            <div class="header-center text-center"></div>
            <div class="header-right">
                <div class="f1inv-legend">
                    <span class="f1inv-legend-item"><i class="f1inv-legend-dot plus"></i>실재고 &gt; ERP재고</span>
                    <span class="f1inv-legend-item"><i class="f1inv-legend-dot minus"></i>실재고 &lt; ERP재고</span>
                </div>
            </div>
        </div>

        <!-- 레이아웃 안의 레이아웃 프레임 (표 전용 카드) -->
        <div class="inner-layout-card">
            <div class="f1inv-table-scroll">
                <table class="f1inv-table">
                    <colgroup>
                        <col class="f1inv-col-loc">   <!-- 저장위치 -->
                        <col class="f1inv-col-code">  <!-- 품목코드 -->
                        <col>                         <!-- 품목명 (남은 공간 전부) -->
                        <col class="f1inv-col-erp">   <!-- ERP 재고 -->
                        <col class="f1inv-col-io">    <!-- 전일 입고 -->
                        <col class="f1inv-col-io">    <!-- 전일 사용 -->
                        <col class="f1inv-col-real">  <!-- B5 -->
                        <col class="f1inv-col-real">  <!-- B6 -->
                        <col class="f1inv-col-real">  <!-- B6(주행지) -->
                        <col class="f1inv-col-sum">   <!-- 합계 -->
                        <col class="f1inv-col-diff">  <!-- 실재고 - ERP재고 -->
                    </colgroup>
                    <thead>
                        <tr class="f1inv-thead-lv1">
                            <th>저장위치</th>
                            <th colspan="2" class="f1inv-sep">품목</th>
                            <th rowspan="2" class="f1inv-sep">ERP 재고</th>
                            <th rowspan="2">전일 입고</th>
                            <th rowspan="2">전일 사용</th>
                            <th colspan="4" class="f1inv-sep">실재고</th>
                            <th rowspan="2" class="f1inv-sep">실재고<br>- ERP재고</th>
                        </tr>
                        <tr class="f1inv-thead-lv2">
                            <th>저장위치명</th>
                            <th class="f1inv-sep">품목코드</th>
                            <th>품목명</th>
                            <th class="f1inv-sep">B5</th>
                            <th>B6</th>
                            <th>B6(주행지)</th>
                            <th>합계</th>
                        </tr>
                    </thead>
                    <tbody id="f1invBody">
                        <tr class="f1inv-placeholder"><td colspan="11">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="f3iNoticeModal" class="f3i-nmodal-overlay">

        <div class="f3i-nmodal-header">

                <span class="material-symbols-outlined">arrow_back</span> 뒤로가기
            </button>
            <span id="f3iNoticeModalTitle" class="f3i-nmodal-title">전체 공지사항 목록</span>
            <span id="f3iNoticeCloseBtn" class="material-symbols-outlined f3i-nmodal-close">close</span>
        </div>
        <div class="f3i-nmodal-body" id="f3iNoticeModalBody"></div>
        <div class="f3i-nmodal-footer-info" id="f3iMasterNoticeInfo" style="display: none;">
            ⚠️ 마스터 모드: 글이나 HTML 태그를 편집한 후 상단 [저장] 버튼을 누르면 확정됩니다.
        </div>
    </div>
