<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주소가 바뀌었습니다 — MK Paper</title>

    <!-- JS 가 꺼진 환경에서만 동작하는 안전망입니다. 경로를 그대로
         옮기지는 못하고 첫 화면으로만 보냅니다. -->
    <noscript>
        <meta http-equiv="refresh" content="0; url=https://mk-paper-inventory.pages.dev/">
    </noscript>

    <style>
        *, *:before, *:after { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Malgun Gothic", "맑은 고딕", sans-serif;
            color: #1d1d1f;
            /* 새 포털(css/portal.css)과 같은 배경 — 넘어가는 호흡을 잇습니다 */
            background-color: #eef1f6;
            background-image:
                radial-gradient(120% 70% at 50% -10%, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 55%),
                linear-gradient(180deg, #f0f3f7 0%, #eef1f6 45%, #e9edf3 100%);
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 36px 28px 30px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 12px 32px rgba(16,24,40,.10);
            text-align: center;
            animation: rise .45s cubic-bezier(.22,.61,.36,1) both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: none; }
        }
        /* '애니메이션 효과'를 꺼 둔 현장 PC 를 배려합니다 */
        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; }
        }

        h1 { margin: 0 0 10px; font-size: 20px; letter-spacing: -.2px; }
        p  { margin: 0 0 8px; font-size: 14px; line-height: 1.65; color: #4b5563; }

        .addr {
            display: block;
            margin: 18px 0 22px;
            padding: 11px 12px;
            border-radius: 10px;
            background: #f3f5f9;
            font-size: 13px;
            color: #374151;
            word-break: break-all;
        }

        .go {
            display: inline-block;
            padding: 12px 26px;
            border-radius: 999px;
            background: #1f2937;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
        }
        .go:hover { background: #111827; }

        .hint { margin-top: 18px; font-size: 12.5px; color: #6b7280; }
        .tip  { margin-top: 4px;  font-size: 12.5px; color: #9ca3af; }
    </style>
</head>
<body>

<div class="card">
    <h1>주소가 바뀌었습니다</h1>
    <p>1공장과 3공장 화면이 한 주소로 합쳐졌습니다.<br>잠시 후 새 주소로 넘어갑니다.</p>

    <code class="addr" id="dest">https://mk-paper-inventory.pages.dev/</code>

    <a class="go" id="goBtn" href="https://mk-paper-inventory.pages.dev/">지금 이동하기</a>

    <p class="hint">이 주소는 더 이상 쓰지 않습니다.</p>
    <p class="tip">즐겨찾기를 새 주소로 바꿔 주세요.</p>
</div>

<script>
(function () {
    'use strict';

    /* 옛 주소와 새 주소는 도메인 뒤 경로가 같습니다.
         옛 : eellooyy.github.io/factory1/factory1_ipgo.html
         새 : mk-paper-inventory.pages.dev/factory1/factory1_ipgo.html
       그래서 경로를 그대로 붙이면 보시던 그 페이지로 바로 갑니다.
       즐겨찾기를 세부 페이지로 걸어 두신 분들이 메뉴를 다시 타지 않도록. */
    var NEW_ORIGIN = 'https://mk-paper-inventory.pages.dev';

    var path = location.pathname || '/';

    /* 경로가 /factory1/ 이나 /factory3/ 로 시작할 때만 그대로 옮깁니다.
       그 밖의 주소는 어디로 보내야 할지 알 수 없으니 첫 화면으로 보냅니다. */
    if (!/^\/factory[13]\//.test(path)) path = '/';

    var dest = NEW_ORIGIN + path + (location.search || '') + (location.hash || '');

    document.getElementById('dest').textContent = dest;
    document.getElementById('goBtn').setAttribute('href', dest);

    /* 바로 넘기지 않고 2.5초를 둡니다 — 주소가 바뀌었다는 걸 한 번은
       보셔야 즐겨찾기를 고치실 수 있습니다.
       replace 를 쓰는 이유: 이 페이지가 방문 기록에 남으면 새 화면에서
       뒤로가기를 눌렀을 때 여기로 돌아와 또 튕깁니다. */
    setTimeout(function () { location.replace(dest); }, 2500);
})();
</script>

</body>
</html>
